<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS-2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- Layout and Components in Tailwind CSS 
    flex, flex-row, flex-col, justify-center, justify-between, items-center, gap-4
    -->
    <div class="flex gap-4 border-4 h-96 items-center justify-center">
        <div class="bg-[#ff3377] p-4 m-2 w-40  h-40 flex justify-center items-center">div-1</div>
        <div class="bg-green-300 p-4 m-2 w-[180px]  h-40 flex justify-center items-center">div-2</div>
        <div class="bg-blue-400 p-4 m-2 w-40  h-40 flex justify-center items-center">div-3</div>
        <div class="bg-orange-400 p-4 m-2 w-40  h-40 flex justify-center items-center">div-3</div>
    </div>


    <!-- Grid in Tailwind CSS -->     <!-- Border, rounded, shadow -->
    <div class="grid grid-rows-3 grid-flow-col gap-2 m-5">
        <div class="bg-gray-200 p-2 flex justify-center items-center">col-1</div>
        <div class="bg-gray-400 p-2 flex justify-center items-center">col-2</div>
        <div class="bg-gray-600 p-2 flex justify-center items-center">col-3</div>
        <div class="p-2 text-center border-2 rounded-lg shadow-md">col-4</div>
    </div>

<!-- Buttons -->
<button class="bg-sky-400 p-2 w-24 rounded-sm Border-none shadow-sm text-white m-5 hover: bg-green-400">Login</button>

    
</body>
</html>
